name: Build and verify

'on':
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sulmp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (no game files)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM cross-build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          mkdir -p "$RUNNER_TEMP/sulmp-llvm"
          ln -s "$(command -v clang-cl-18)" "$RUNNER_TEMP/sulmp-llvm/clang-cl"
          ln -s "$(command -v lld-link-18)" "$RUNNER_TEMP/sulmp-llvm/lld-link"
          echo "$RUNNER_TEMP/sulmp-llvm" >> "$GITHUB_PATH"
      - name: Verify tracked source, build, test tooling and package
        shell: bash
        run: bash tools/ci.sh
      - name: Retain verified build packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ShutUpAndLetMePlay-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
